        - "Other"

    documentDescription:
      description: |
        A description of the document.
      type: string
      example: "Bill for services rendered."

    documentEffectiveDate:
      description: |
        The effective date of the document in question. This is the date when the document is considered to be effective.
      type: string
      format: date
      example: "2024-11-29"
      
    externalEventId:
      description: |
        An ID of an event in an external system which yielded the most recent change of the cross-reference. The format of the external event ID is determined by external system which brought the event about.
      type: string
      example: "edd45ff6-265e-4cda-8d58-bdefea00acd2"


    #####################################################
    # Standard messages
    #####################################################


    MessageCode401:
      description: Message codes for HTTP error code 401 (UNAUTHORIZED).
      type: string
      enum:
        - "CERTIFICATE_INVALID"
        - "ROLE_INVALID"
        - "CERTIFICATE_EXPIRED"
        - "CERTIFICATE_BLOCKED"
        - "CERTIFICATE_REVOKE"
        - "CERTIFICATE_MISSING"
        - "SIGNATURE_INVALID"
        - "SIGNATURE_MISSING"
        - "TOKEN_UNKNOWN"
        - "TOKEN_INVALID"
        - "TOKEN_EXPIRED"

    MessageCode403:
      description: Message codes for HTTP error code 403 (FORBIDDEN).
      type: string
      enum:
        - "SERVICE_BLOCKED"
        - "RESOURCE_UNKNOWN"
        - "RESOURCE_EXPIRED"

    MessageCode404:
      description: Message codes for HTTP error code 404 (NOT FOUND).
      type: string
      enum:
        - "RESOURCE_UNKNOWN"

    MessageCode429:
      description: Message codes for HTTP error code 429 (TOO MANY REQUESTS).
      type: string
      enum:
        - "ACCESS_EXCEEDED"

    MessageCode500:
      description: Message codes for HTTP error code 500 (INTERNAL SERVER ERROR).
      type: string
      enum:
        - "INTERNAL_ERROR"
        - "DOWNSTREAM_ERROR"

    MessageCode503:
      description: Message codes for HTTP error code 503 (SERVICE UNAVAILABLE).
      type: string
      enum:
        - "SERVICE_UNAVAILABLE"

    #####################################################
    # Error Schemas
    #####################################################

    Error400:
      description: |
        Error information for HTTP error code 400.
        Uses oneOf to distinguish between format errors and validation errors.
      oneOf:
        - $ref: "#/components/schemas/FormatError"
        - $ref: "#/components/schemas/ValidationError"
      discriminator:
        propertyName: code
        mapping:
          FORMAT_ERROR: "#/components/schemas/FormatError"
          VALIDATION_ERROR: "#/components/schemas/ValidationError"

    FormatError:
      description: |
        The request body is malformed (e.g. invalid JSON syntax, wrong encoding).
      type: object
      required:
        - type
        - code
      properties:
        type:
          description: |
            A URI reference [RFC3986] that identifies the problem type.
          type: string
          format: uri
          maxLength: 70
        title:
          description: |
            Short human readable description of error type.
          type: string
          maxLength: 70
        detail:
          description: |
            Detailed human readable text specific to this instance of the error.
          type: string
          maxLength: 500
        code:
          type: string
          enum:
            - "FORMAT_ERROR"
        meta:
          description: |
            Free-form object for additional metadata about the error.
          type: object

    ValidationError:
      description: |
        The request is well-formed but fails schema or business validation.
      type: object
      required:
        - type
        - code
        - errors
      properties:
        type:
          description: |
            A URI reference [RFC3986] that identifies the problem type.
          type: string
          format: uri
          maxLength: 70
        title:
          description: |
            Short human readable description of error type.
          type: string
          maxLength: 70
        code:
          type: string
          enum:
            - "VALIDATION_ERROR"
        errors:
          description: |
            List of all validation errors found in the request.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - source
              - path
              - detail
            properties:
              source:
                description: |
                  The part of the request that contains the invalid input.
                type: string
                enum:
                  - "query"
                  - "body"
                  - "path"
                  - "header"
              path:
                description: |
                  Path to the field that caused the error (e.g. "documents[0].senderId").
                type: string
                maxLength: 200
              detail:
                description: |
                  Human readable description of the validation error.
                type: string
                maxLength: 500
              value:
                description: |
                  The rejected value. Optional, and should be omitted for sensitive fields.
                type: string
                maxLength: 200
              meta:
                description: |
                  Free-form object for additional metadata about the error.
                type: object
        meta:
          description: |
            Free-form object for additional metadata about the error.
          type: object

    Error401:
      description: |
        Standardised definition of reporting error information
        in case of a HTTP error code 401.
      type: object
      required:
