  parameters:
  #####################################################
  # Predefined Parameters
  #####################################################

    page:
      name: page
      in: query
      description: Requested page
      required: false
      schema:
        type: integer
        default: 1

    itemsPerPage:
      name: itemsPerPage
      in: query
      description: Records per page
      required: false
      schema:
        type: integer
        default: 100

    claimId:
      name: claimId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/claimId"

    X-Request-ID:
      name: X-Request-ID
      in: header
      description: |
        Unique value generated by the client which the resource server uses to recognize subsequent 
        retries of the same request.
      required: true
      example: "99391c7e-ad88-49ec-a2ad-99ddcb1f7721"
      schema:
        type: string
        format: uuid

    X-Idempotency-Key:
      name: X-Idempotency-Key
      in: header
      description: Idempotency key
      required: false
      example: "99391c7e-ad88-49ec-a2ad-99ddcb1f7721"
      schema:
        type: string
        format: uuid

    dateFrom:
      name: dateFrom
      in: query
      required: true
      schema:
        type: string
        format: date
        example: "2022-01-31"

    dateTo:
      name: dateTo
      in: query
      required: true
      schema:
        type: string
        format: date
        example: "2022-01-31"

    claimantId:
      name: claimantId
      in: query
      description: |
        ClaimantId is the Icelandic kennitala for the claimant
      required: false
      schema:
        $ref: "#/components/schemas/kennitala" 

    templateIdPath:
      name: templateId
      in: path
      description: |
        Unique template id defined by the banks.
      required: true
      schema:
        type: string

    templateId:
      name: templateId
      in: query
      description: |
        Filter claims by templateId (exact match). Optional.
      required: false
      schema:
        type: string       

    bank:
      name: bank
      in: query
      description: |
        Branch number
      schema:
        $ref: "#/components/schemas/bank"

    templateCode:
      name: templateCode
      in: query
      description: |
        Claim template code
      schema:
        $ref: "#/components/schemas/templateCode"

    depositAccount:
      name: depositAccount
      in: query
      description: |
        Deposit account filter
      schema:
        $ref: "#/components/schemas/account"

    payorId:
      name: payorId
      in: query
      description: |
        PayorId is the Icelandic kennitala for the payor
      schema:
        $ref: "#/components/schemas/kennitala"

    dateSpanReferenceDate:
      name: dateType
      in: query
      description: |
        Date type to search for
      schema:
        $ref: "#/components/schemas/dateSpanReferenceDate"

    status:
      name: status
      in: query
      description: |
        The claim status to search for
      schema:
        $ref: "#/components/schemas/claimStatus"

    collectionStatus:
      name: collectionStatus
      in: query
      description: |
        The collection status to search for
      schema:
        $ref: "#/components/schemas/collectionStatus"

    isActive:
      name: isActive
      in: query
      description: |
        Is active state true or false.
      schema:
        $ref: "#/components/schemas/isActive"

    batchId:
      name: batchId
      in: path
      required: true
      description: |
        Unique identifier for a batch of claims
      schema:
        $ref: "#/components/schemas/batchId"

  requestBodies:
  #####################################################
  # Reusable Request Bodies
  #####################################################

    batchInitiation:
      description: |
        JSON request body for a list of create or alter actions initiation request message
      required: true
      content:
        application/json:
          schema:
            discriminator:
              propertyName: actionType
              mapping:
                create: "#/components/schemas/batchCreateInitiation"
                alter: "#/components/schemas/batchAlterInitiation"
                cancel: "#/components/schemas/batchCancelInitiation"
                secondaryCollection: "#/components/schemas/batchSecondaryCollectionInitiation"
                returnSecondaryCollection: "#/components/schemas/batchReturnSecondaryCollectionInitiation"

            oneOf: 
              - $ref: "#/components/schemas/batchCreateInitiation"
              - $ref: "#/components/schemas/batchAlterInitiation"
              - $ref: "#/components/schemas/batchCancelInitiation"
              - $ref: "#/components/schemas/batchSecondaryCollectionInitiation"
              - $ref: "#/components/schemas/batchReturnSecondaryCollectionInitiation"
          examples:
            secondaryCollection:
              $ref: "#/components/examples/secondaryCollectionBatch-201_RequestExample"

    mergeClaim:
      description: |
        JSON request body for a create claim request message
      required: true
      content:
        application/merge-patch+json:
          schema:
            $ref: "#/components/schemas/mergeClaimDetails"

    createClaim:
      description: |
        JSON request body for a create claim request message
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/createClaimDetails"
          examples:
            create:
              $ref: "#/components/examples/createClaims-201_Example"
  headers:
   #####################################################
  # Reusable Response Header Elements
  #####################################################

    X-Request-ID:
      description: ID of the request, unique to the call, as determined by the initiating party.
      required: true
      example: "99391c7e-ad88-49ec-a2ad-99ddcb1f7721"
      schema:
        type: string
        format: uuid

    Location:
      description: |
        Location of the created resource.
      schema:
        type: string
        format: url
      required: false

  responses:
  #####################################################
   # Reusable Responses
  #####################################################
    #####################################################
    # Positive Responses
    #####################################################

    OK_20x_ActionResponse:
      description: Batch created
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/batchStatus"
          examples:
            Example:
              $ref: "#/components/examples/alterBatch-200_Example"
            secondaryCollection:
              $ref: "#/components/examples/secondaryCollectionBatch-200_Example"

    OK_201_ActionSingleResponse:
      description: Claim created (single item response)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/claimStatusSingleResponse"

    OK_200_ActionSingleResponse:
      description: Claim updated (single item response)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/claimStatusSingleResponse"

    OK_200_ClaimTransactionListInformation:
      description: |
        Claim transaction list information.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-Paging-CurrentPage:
          description: |
            Current page number
          schema:
            type: integer
        X-Paging-TotalPages:
          description: |
            Total pages
          schema:
            type: integer
        X-Paging-TotalItems:
          description: |
            Total items
          schema:
            type: integer
        X-Paging-PerPage:
          description: |
            Items per page
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/claimTransactionList"
          examples:
            "Example":
              $ref: "#/components/examples/getClaimPayments-200_Example"

    OK_200_ClaimHistoryListInformation:
      description: |
        Claim history list information response.
      headers:
        X-Paging-CurrentPage:
          description: |
            Current page number
          schema:
            type: integer
        X-Paging-TotalPages:
          description: |
            Total pages
          schema:
            type: integer
        X-Paging-TotalItems:
          description: |
            Total items
          schema:
            type: integer
        X-Paging-PerPage:
          description: |
            Items per page
          schema:
            type: integer
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/claimHistoryList"
          examples:
            "Example":
              $ref: "#/components/examples/getClaimHistory-200_Example"

    OK_200_QueryClaimInformation:
      description: |
        Query claim information.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/claimDetails"
          examples:
            "Example":
              $ref: "#/components/examples/getClaim-200_Example"

    OK_200_QueryClaimListInformation:
      description: |
