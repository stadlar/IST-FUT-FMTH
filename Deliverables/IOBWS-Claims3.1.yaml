openapi: 3.0.1
info:
  title: IOBWS 3.0 Domestic Claims
  version: "3.1"
  description: |
    The claim service is focused on two parties. First is the company (claimant) who creates claims and then
    the collection company.  

    The Claims Service enables creditors to create, modify and cancel claims. A creditor can also revive canceled
    claims, send claims to an intermediate debt collector and obtain a list of claims according to the given search
    criteria, and thus get a good overview of all their claims.

    There is no Collection Service as it has been merged with the claimant endpoints. There is a restriction on the 
    collection company, it's not allowed to create claims. The claim service enables debt collectors to work 
    with the claims under their care. The service is mostly as structured as the service for claims, except 
    that it is not possible to create collection claims

  contact:
    name: Stadlarad Islands
    url: https://www.stadlar.is
    email: stadlar@stadlar.is
  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: https://claims.example.com
    description: Example production server
  - url: https://claims-sandbox.example.com
    description: Sandbox server for testing

# Global security: all operations require bearer token
security:
  - BearerAuthOAuth: []

paths:
  /v1/templates:
    get:
      summary: Get a list of claim templates
      description: |
        Returns a list of claim templates according to the filters provided. Claim template describes many 
        attributes of the claim process and gives the consumer key information needed.
      operationId: getTemplateList
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/claimantId"
        - $ref: "#/components/parameters/bank"
        - $ref: "#/components/parameters/templateCode"
        - $ref: "#/components/parameters/isActive"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/itemsPerPage"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_ClaimListTemplate" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/templates/{templateId}:
    get:
      summary: Get a single claim template
      description: |
        Returns a single claim template by the supplied templateId.
      operationId: getTemplate
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/templateIdPath"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_Template" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/claims:
    get:
      summary: Get a list of claims as defined by the query parameters.
      description: |
        A list of claims can be filtered by multiple query parameters to obtain a focused result.
        The function returns a paginated list of claims; use page and itemsPerPage for paging.
        Parameters:
        - dateFrom: Search starting date
        - dateTo: Search end date
        - dateSpanReferenceDate: When a date range (from/to) is defined this indicates which date field the range applies to. Possible values are:
          - DueDate: The claim's due date
          - FinalDueDate: The claim's final due date
          - ExpirationDate: The claim cancellation date
          - ClosingDate: Date when the claim was paid, cancelled or transferred.
          - CreationDate: When the claim was created
          - LastChangeDate: Last claim change event date
        - claimantId: The claim claimant
        - payorId: The claim payor
        - status: Claim status is one of ["Unpaid", "Paid", "Cancelled"]
        - collectionStatus: Claim collection process state:
          - PrimaryCollection
          - WaitingForSecondary
          - SecondaryCollection
          - LegalCollection
        - templateCode: Bank claim template code        
      operationId: getClaims
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/dateFrom"
        - $ref: "#/components/parameters/dateTo"
        - $ref: "#/components/parameters/dateSpanReferenceDate"
        - $ref: "#/components/parameters/claimantId"
        - $ref: "#/components/parameters/payorId"
        - $ref: "#/components/parameters/status"
        - $ref: "#/components/parameters/collectionStatus"
        - $ref: "#/components/parameters/templateCode"
        - $ref: "#/components/parameters/templateId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/itemsPerPage"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_QueryClaimListInformation" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

    post:
      summary: Create a single claim
      description: |        
        Claim creation returns an immediate response: if successful, claimKey, claimId, and directPaymentClaim are included; otherwise, an error is returned.
      operationId: createClaim
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/X-Request-ID"
        - $ref: "#/components/parameters/X-Idempotency-Key"
      requestBody:
        $ref: "#/components/requestBodies/createClaim"
      responses:
        '201': { $ref: "#/components/responses/OK_201_ActionSingleResponse" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/claims/{claimId}:
    get:
      summary: Get single claim
      description: |
        Fetch detail information for a single claim by claimID. Detailed information on fields in claimDetails.

      operationId: getClaim
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/claimId"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_QueryClaimInformation" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

    patch:
      summary: Patch a single claim
      description: |
        The patch claim method modifies a previously created claim.

        A cancelled claim is recreated by changing its status from "Cancelled" back to "Unpaid". Recreating a claim keeps existing history.

        To cancel a claim change status to "Cancelled".

        To move a claim between collection phases change collectionStatus:
        - SecondaryCollection (for secondary)
        - PrimaryCollection (for primary)

        For further input parameter descriptions, see the mergeClaimDetails request object.

      operationId: patchClaim
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/claimId"
        - $ref: "#/components/parameters/X-Request-ID"
      requestBody:
        $ref: "#/components/requestBodies/mergeClaim"  # JSON Merge Patch
      responses:
        '200': { $ref: "#/components/responses/OK_200_ActionSingleResponse" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/claims/{claimId}/transactions:
    get:
      summary: Get payments for a single claim
      description: |
        Returns all claim payments. When claim is paid by debtor the claim payment is visible in near real-time.
      operationId: getClaimTransactions
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/claimId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/itemsPerPage"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_ClaimTransactionListInformation" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/claims/{claimId}/history:
    get:
      summary: Get single claim history
      description: |
        Claim history contains every event for the claim from the beginning, i.e., all changes that
        have been made to the claim together with information about the claim itself.
      operationId: getClaimHistory
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/claimId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/itemsPerPage"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_ClaimHistoryListInformation" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/claims/transactions:
    get:
      summary: Get payments for multiple claims
      description: |
        Returns all payments for a given claim.  Payment information is accessible near real-time.
      operationId: getClaimsTransactions
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/claimantId"
        - $ref: "#/components/parameters/dateFrom"
        - $ref: "#/components/parameters/dateTo"
        - $ref: "#/components/parameters/templateCode"
        - $ref: "#/components/parameters/depositAccount"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/itemsPerPage"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_200_ClaimTransactionListInformation" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/batches:
    post:
      summary: Creates a batch. Batch is a list of actions defined in the body
      description: |
        Accepts one of five request bodies that indicate the action type:

        **batchCreateInitiation** - Initiates a batch with a list of claims to be created.

        **batchAlterInitiation** - Initiates a batch with a list of claims to be altered.
 
        **batchCancelInitiation** - Initiates a batch with a list of claims to be cancelled.

        **batchSecondaryCollectionInitiation** - Initiates a batch with a list of claims to be moved to secondary collection.

        **batchReturnSecondaryCollectionInitiation** - Initiates a batch with a list of claims to be returned from secondary collection back to primary collection.
        
        Claim handling guidelines:
          Claim is modified by submitting the complete claim object with all intended values. Partial updates are not supported.
          Fields that must remain unchanged need to be included.
         
          Recreating a previously cancelled claim must be done by calling the create operation.   
                  
        
      operationId: postBatch
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/X-Request-ID"
        - $ref: "#/components/parameters/X-Idempotency-Key"
      requestBody:
        $ref: "#/components/requestBodies/batchInitiation"
      responses:
        '201': { $ref: "#/components/responses/OK_20x_ActionResponse" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }

  /v1/batches/{batchId}:
    get:
      summary: Get a status of previously created batch
      description: |
        Get status of a batch. The status contains number of claims processed under the following categories:
        - Success: Number of successful processed claims
        - Failed: Number of failed claims
        - Pending: Number of waiting claims
      operationId: getBatchStatus
      tags: [Claim Service]
      parameters:
        - $ref: "#/components/parameters/batchId"
        - $ref: "#/components/parameters/X-Request-ID"
      responses:
        '200': { $ref: "#/components/responses/OK_20x_ActionResponse" }
        '400': { $ref: "#/components/responses/BAD_REQUEST_400" }
        '401': { $ref: "#/components/responses/UNAUTHORIZED_401" }
        '403': { $ref: "#/components/responses/FORBIDDEN_403" }
        '404': { $ref: "#/components/responses/NOT_FOUND_404" }
        '405': { $ref: "#/components/responses/METHOD_NOT_ALLOWED_405" }
        '408': { $ref: "#/components/responses/REQUEST_TIMEOUT_408" }
        '415': { $ref: "#/components/responses/UNSUPPORTED_MEDIA_TYPE_415" }
        '500': { $ref: "#/components/responses/INTERNAL_SERVER_ERROR_500" }
        '503': { $ref: "#/components/responses/SERVICE_UNAVAILABLE_503" }
components:
  securitySchemes:
    BearerAuthOAuth:
      description: |
        Bearer Token (OAuth2 access token transported via Authorization header).
      type: http
      scheme: bearer

  schemas:
    batchId:
      description: |
        Batch identifier for a list of claims
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36

    claimantId:
      description: |
        ClaimantId is the Icelandic kennitala for the claimant
      type: string
      pattern: '[0-9]{10}'

    dueDate:
      description: Due date
      type: string
      format: date
      example: "2022-01-31"   

    claimId:
      description: |
        ClaimId is a composite string key for a claim made of kennitala, account and due date
          - ClaimantId
          - Branch number
          - 66
          - Claim no
          - /+        
          - Date in the form of YYYYMMDD
      type: string
      example: "0101010101000166000001+20221231"

    account:
      description: |
        Bank number, ledger and number.
        For claims ledger is 66 followed by claim number
      type: string
      pattern: "[0-9]{12}"
      example: "000166123456"


    templateCode:
      description: |
        Claim template identifier.
      type: string
      pattern: "[0-9A-Z]{3}"
      example: "001"

    bank:
      description: |
        Icelandic branch number.
      type: string
      pattern: "[0-9]{4}"
      example: "0001"

    kennitala:
      description: |
        Icelandic Id number (kennitala).
      type: string
      pattern: "[0-9]{10}"
      example: "0208715009"

    reference:
      description: |
        Reference number determined by creditors.
      type: string
      maxLength: 16

    categoryCode:   
      description: |
        Creditors' text key, explanation of payment. Optional attribute on claim
      type: string
      maxLength: 2
      pattern: '[0-9]{2}'

    isActive:
      description: Describes is active state.
      type: boolean

    dateSpanReferenceDate:
      description: |
        Types of dates are as follows:
          - DueDate: The claim's due date
          - FinalDueDate: The claim's final due date
          - ExpirationDate: The claim cancellation date
          - ClosingDate:  Date when the claim was paid, cancelled or transferred.
          - CreationDate: When the claim was created
          - LastChangeDate: Last claim change event date
      type: string
      enum:
        - "DueDate"
        - "FinalDueDate"
        - "ExpirationDate"
        - "ClosingDate"
        - "CreationDate"
        - "LastChangeDate"

    claimStatusSingleResponse:
      description: |
        Batch status object.
      properties:
        success:
          $ref: "#/components/schemas/claimStatusSuccess"
        error:
          $ref: "#/components/schemas/claimStatusError"

    claimStatusResponse:
      description: |
        Batch status object.
      properties:
        successes:
          type: array
          items:
            $ref: "#/components/schemas/claimStatusSuccess"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/claimStatusError"

    claimStatusSuccess:
      description: |
        Batch success status item.
      properties:
        claimKey:
          $ref: "#/components/schemas/claimKey"
        claimId:
          $ref: "#/components/schemas/claimId"
        directPaymentClaim:
          type: boolean
        print:
          type: boolean

    claimStatusError:
      description: |
        Batch error status item.
      properties:
        claimKey:
          $ref: "#/components/schemas/claimKey"
        claimId:
          $ref: "#/components/schemas/claimId"
        resultCode:
          type: string
          enum:
            - "CLAIM_EXISTS"
            - "CLAIM_IS_PAID"
            - "CLAIM_NOT_FOUND"
            - "CLAIM_IS_CANCELLED"
            - "CLAIM_NOT_IN_SECONDARY_STATE"
            - "CLAIM_OTHERS"
        resultSubCode:
          type: string
        resultMessage:
          type: string

    claimTemplateCategory:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 2
          minLength: 2
        name:
          type: string
          maxLength: 30

    depositAccount:
      description: |
        Information on the main disposal account.
      properties:
        id:
          $ref: "#/components/schemas/account"
        ownerId:
          $ref: "#/components/schemas/kennitala"

    depositAccountWithDetails:
      description: |
        Additional disposition invoices. Used to dispose of fees, costs or part of the payment of the claim. There
        can be a maximum of 98 accounts for each identifier.

      properties:
        id:
          $ref: "#/components/schemas/account"
        ownerId:
          $ref: "#/components/schemas/kennitala"
        type:        
          description: |
            Describes what type of additional deposit account this is.

            - "DefaultInterest" - Penalty interest.
            - "DefaultCharge" - Default cost.
            - "OtherDefaultCosts" - Other default costs.
            - "AllDefaultCharges" - All default costs.
            - "OtherCosts" - Other costs.
            - "NoticeAndPaymentFee" - Notification fee.
            - "AllCosts" - All costs and fees imposed on the claim.
            - "FixedAmount" - A fixed amount is deducted from the amount of the payment and deposited in a disposable account.
            - "Percentage" - Percentage of the amount of the payment deposited in the disposable account.
            - "PrincipalDetail" - Amount of the principal of the payment deposited in a disposable account.
          type: string
          enum:
            - "DefaultInterest"
            - "DefaultCharge"
            - "OtherDefaultCosts"
            - "AllDefaultCharges"
            - "OtherCosts"
            - "NoticeAndPaymentFee"
            - "AllCosts"
            - "FixedAmount"
            - "Percentage"
            - "PrincipalDetail"
        priority:
          description: Priority controls in which order the additional deposit is executed
          type: integer
        depositAmount:
          $ref: "#/components/schemas/depositAccountAmount"

    depositAccountAmount:
      description: |
        Describes what kind of deposit this is (percentage based or fixed amount)
      type: object
      properties:
        value:
          type: number
        valueType:
          type: string
          enum: 
            - "FixedAmount"
            - "Percentage"

    templateListDetails:
      description: |
        Claim template details.
      type: object
      properties:
        templateId:
          description: Unique Id for each template. This is specific to each bank.
          type: string
        claimantId:
          $ref: "#/components/schemas/claimantId"
        bank:
          $ref: "#/components/schemas/bank"
        templateCode:
          $ref: "#/components/schemas/templateCode"
        collectionType:
          $ref: "#/components/schemas/collectionType"
        category:
          $ref: "#/components/schemas/claimTemplateCategory"
        claimantStatementExtendedReferenceType:
          $ref: "#/components/schemas/claimantStatementExtendedReferenceType"
        customerNumberTemplate:
          description: Describes how the transaction number template is structured for the claim template.
          type: string
          maxLength: 16
        claimantStatementReferenceType:
          $ref: "#/components/schemas/claimantStatementReferenceType"
        depositAccount:
          $ref: "#/components/schemas/depositAccount"
        secondaryCollectionTemplateCode:
          description: |
            ID of a collection claim template to which claims are transferred.
          type: string
          pattern: "[0-9A-Za-z]{3}"
          example: "MI1"
        withdrawalAccount:
          $ref: "#/components/schemas/account"

    templateDetails:
      description: |
        Claim template details.
      type: object
      properties:
        templateId:
          description: Unique Id for each template. This is specific to each bank.
          type: string
        claimantId:
          $ref: "#/components/schemas/claimantId"
        bank:
          $ref: "#/components/schemas/bank"
        templateCode:
          $ref: "#/components/schemas/templateCode"
        collectionType:
          $ref: "#/components/schemas/collectionType"
        category:
          $ref: "#/components/schemas/claimTemplateCategory"
        claimantStatementExtendedReferenceType:
          $ref: "#/components/schemas/claimantStatementExtendedReferenceType"
        customerNumberTemplate:
          description: Describes how the transaction number template is structured for the claim template.
          type: string
          maxLength: 16
        claimantStatementReferenceType:
          $ref: "#/components/schemas/claimantStatementReferenceType"
        depositAccount:
          $ref: "#/components/schemas/depositAccount"
        secondaryCollectionTemplateCode:
          description: |
            ID of a collection claim template to which claims are transferred.
          type: string
          pattern: "[0-9A-Za-z]{3}"
          example: "MI1"
        withdrawalAccount:
          $ref: "#/components/schemas/account"
        additionalDepositAccounts:
          type: array
          items:
            $ref: "#/components/schemas/depositAccountWithDetails"
        isActive:
          type: boolean
        settings:
          $ref: "#/components/schemas/claimTemplateSettings"

    claimTemplateSettings:
      description: |
        Default claim settings applied when creating claims for this template. 
        Individual claims may override these values where the claim schema permits.
      type: object
      properties:
        amount:
          description: Default claim amount.
          type: number
        reference:
          $ref: "#/components/schemas/reference"
        defaultInterest:
          $ref: "#/components/schemas/defaultInterest"
        defaultCharge:
          $ref: "#/components/schemas/defaultCharge"
        paymentFee:
          $ref: "#/components/schemas/paymentFee"
        discount:
          $ref: "#/components/schemas/discount"
        otherCostsAmount:
          description: Default other costs (added to claim).
          type: number
        otherDefaultCostsAmount:
          description: Default other default costs (e.g. intermediate collection fee).
          type: number
        currency:
          description: Default ISO 4217 currency code.
          type: string
          pattern: '[A-Z]{3}'
        isOutOfSequencePaymentAllowed:
          description: Payment rule, allow paying later installments before earlier ones.
          type: boolean
        isPartialPaymentAllowed:
          description: Partial payment is allowed.
          type: boolean
        claimType:
          $ref: "#/components/schemas/claimType"
        billNumber:
          description: 7 character bill number shown on payer account statement.
          type: string
          maxLength: 7
        dueDateRule:
          $ref: "#/components/schemas/dateRuleDayOfMonth"
        finalDueDateRule:
          $ref: "#/components/schemas/dateRuleNumberOfDays"
        cancellationDateRule:
          $ref: "#/components/schemas/dateRuleNumberOfDays"


    dateRuleDayOfMonth:
      description: |
        Rule that sets a date to a fixed day within the calendar month (e.g. 15th of each month).
      type: object
      required:
        - dayOfMonth
      properties:
        dayOfMonth:
          description: Day of month (1-31). If a month has fewer days, business logic decides adjustment.
          type: integer
          minimum: 1
          maximum: 31

    dateRuleNumberOfDays:
      description: |
        Rule that calculates a target date by adding an offset in days to another base date (e.g. +10 days from dueDate).
      type: object
      required:
        - daysOffset
      properties:
        daysOffset:
          description: Number of days to add (0 means same day).
          type: integer
          minimum: 0
          maximum: 365

    paymentFee:
      description: |
        Additional fee that adds to the claim amount.
      nullable: true
      type: object
      required:
        - printingFee
        - paperlessFee
      properties:
        printingFee:
          description: A fee that is applied if the claim is printed.
          type: number
        paperlessFee:
          description: |
            A fee that is applied if the claim is paperless.
            This fee applies to payors who have opted out of receiving printed letters and to direct debit claims.
          type: number

    claimKey:
      description: |
        Claim key is a composite key of kennitala, account and due date.
      type: object
      required:
        - claimantId
        - account
        - dueDate
      properties:
        claimantId:
          $ref: "#/components/schemas/kennitala"
        account:
          $ref: "#/components/schemas/account"
        dueDate:
          $ref: "#/components/schemas/dueDate"

    dayAmountItem:
      description: |
        For whether to use fixed amount or calculate by percentage from claimAmount when calculating discount or charge.
      properties:
        chargeType:
          type: string
          enum:
            - "Percentage"
            - "Amount"
        day:
          type: integer
          minimum: 0
          maximum: 99
        value:
          type: number
                    
    discount:
      description: |
        Contains detail information about claim discount
      nullable: true
      type: object
      properties:
        referenceDate:
          $ref: "#/components/schemas/referenceDate"
        first:
          $ref: "#/components/schemas/dayAmountItem"
        second:
          $ref: "#/components/schemas/dayAmountItem"

    address:
      description: |
        Address or legal address of a legal entity
      type: object
      properties:
        name:
          type: string
        addressLine:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: '[A-Z]{2}'

    itemRow:
      description: |
        Contains information on the breakdown of the collection claim.
      type: object
      properties:
        text:
          type: string
        amount:
          type: number

    currencyExchangeRate:
      description: |
        Currency contains exchange rate information. Used for collection claims in foreign currency.
      type: object
      properties:
        currency:
          type: string
        rate:
          type: number

    printing:
      description: |
        Contains information if a collection claim is printed at a bank / savings bank to manage the
        printout of the collection claim. Changing a printout to a change entry after printing a note
        does not result in it being reprinted
      nullable: true
      type: object
      properties:       
        payorAddress:
          $ref: "#/components/schemas/address"
        itemRows:
          type: array
          items:
            $ref: "#/components/schemas/itemRow"
        comments:
          type: array
          items:
            type: string

    defaultCharge:
      description: |
        Default charges configuration.
        Defines day offsets from the reference date and whether each charge is percentage-based or a fixed amount.
        For discounts, the amount is calculated from totalAmount.
        For defaultCharge, the charge amount is calculated from claimAmount.
      nullable: true
      type: object
      properties:
        referenceDate:
          $ref: "#/components/schemas/referenceDate"
        first:
          $ref: "#/components/schemas/dayAmountItem"
        second:
          $ref: "#/components/schemas/dayAmountItem"

    defaultInterest:
      description: |
        Contains information on how penalty interest is calculated.
      nullable: true
      type: object
      properties:
        referenceDate:
          $ref: "#/components/schemas/referenceDate"
        baseAmountType:
          description: |
            Indicates the amount by which the penalty interest is calculated.
            - Amount: Penalty interest is calculated on the basis of the amount of the claim.
            - AmountAndDefaultCharge: Penalty interest is calculated on the basis of the amount 
            and arrears of the claim.
          type: string
          enum:
            - "Amount"
            - "AmountAndDefaultCharge"
        baseTimeType:
          description: |
            Indicates at what time the basis of penalty interest is calculated. Time = (number of days/time basis)
            - Daily: Daily interest. Time is used = (number of days / 1), Only for the state.
            - 360: Annual interest rate where the year is calculated as 360 days. Time is used = (number of days / 360).
            - Calendar: Annual interest where the year is calculated with calendar days. Time = is 
              used (number of days / calendar days).
          type: string
          enum:
          - "Daily"
          - "360"
          - "Calendar"
        percentage:
          description: |
            Indicates the percentage of penalty interest. If this area is not specified / returned, the 
            Central Bank's maximum penalty interest rate is used.
            Percentage range is between 0 - 100
          type: number

    claimStatus:
      description: Claim status
      type: string
      enum:
        - "Unpaid"
        - "Paid"
        - "Cancelled"

    collectionStatus:
      description: Claim billing process status
      type: string
      enum:
      - "PrimaryCollection"
      - "WaitingForSecondary"
      - "SecondaryCollection"
      - "LegalCollection"

    claimListDetails:
      description: |
        List of claims
      type: array
      items:
        $ref: "#/components/schemas/claimDetails"

    templateList:
      description: |
        List of claim templates
      type: array
      items:
        $ref: "#/components/schemas/templateListDetails"

    claimDetails:
      description: |
        Detailed information for a single claim. May include discount information (fixed amount or percentage) for early payment. A claim includes detailed billing information. After any payment certain monetary fields (including amount) cannot be changed.
      type: object
      required:
        - claimKey
        - payorId
        - templateCode
        - amount
        - finalDueDate
        - expirationDate
      properties:
        claimKey:
          $ref: "#/components/schemas/claimKey"
        payorId:
          $ref: "#/components/schemas/kennitala"
        claimStatus:
          $ref: "#/components/schemas/claimStatus"
        collectionStatus:
          $ref: "#/components/schemas/collectionStatus"
        expirationDate:
          type: string
          format: date
          example: "2022-01-31"
        closingDate:
          description: Date when the claim was paid, cancelled or transferred.
          type: string
          format: date
          example: "2022-01-31"
        templateCode:
          $ref: "#/components/schemas/templateCode"
        templateId:
          description: Unique Id for each template. This is specific to each bank.
          type: string
        secondaryCollectionTemplateCode:
          $ref: "#/components/schemas/templateCode"
        secondaryCollectionTemplateId:
          description: Unique Id for each template. This is specific to each bank.
          type: string
        categoryCode:        
          $ref: "#/components/schemas/categoryCode"
        categoryDescription:
          description: |
            Description of the categoryCode
          type: string
        amount:
          description: Claim amount
          type: number
          minimum: 0
        defaultChargeAmountDue:
          description: Amount of default charge to be paid
          type: number
          minimum: 0
        defaultInterestAmountDue:
          description: Amount of accrued penalty interests to be paid
          type: number
          minimum: 0
        discountAmountOffered:
          description: Discount that will be granted when a collection claim is paid based on status
          type: number
          minimum: 0
        noticeChargeAmountDue:
          description: Amount of notification charge to be paid.
          type: number
          minimum: 0
        otherCostsAmountDue:
          description: Current other costs to be paid
          type: number
          minimum: 0
        otherDefaultCostsAmountDue:
          description: Current other default costs to be paid
          type: number
          minimum: 0
        totalAmountDue:
          description: Total amount to be paid
          type: number
          minimum: 0
        reference:
          $ref: "#/components/schemas/reference"
        finalDueDate:
          type: string
          format: date
          example: "2022-01-31"
        billNumber:
          description: |
            7-character reference id set by claimant. This ID will be visible on the payer's account statement
          type: string
          maxLength: 7
        customerNumber:
          description: |
            16-character reference id set by claimant. Payer's transaction number. Unique key to the payer of the 
            claim with the creditor. Necessary if a direct payment agreement is to be established
          type: string
          maxLength: 16
        paymentFee:
          $ref: "#/components/schemas/paymentFee"
        otherCostsAmount:
          description: Other costs, including determined fees paid by the payer of a collection claim.
          type: number
          minimum: 0
        otherDefaultCostsAmount:
          description: Determined fees, e.g. intermediate collection fee.
          type: number
          minimum: 0
        defaultCharge:
          $ref: "#/components/schemas/defaultCharge"
        defaultInterest:
          $ref: "#/components/schemas/defaultInterest"
        discount:
          $ref: "#/components/schemas/discount"
        isOutOfSequencePaymentAllowed:
          description: Payment rule, is it allowed to pay the last payment if previous has not been paid
          type: boolean
        isPartialPaymentAllowed:
          type: boolean
        isPartiallyPaid:
          description: Indicates whether payment has been made on the collection claim
          type: boolean
        currency:
          type: string
          pattern: '[A-Z]{3}'
        currencyPaymentRate:
          type: string
          enum:            
            - "PaymentDateRate"
        additionalInformation:
          description: Free text that will be displayed on the claim
          type: string
          maxLength: 200
        printing:
          $ref: "#/components/schemas/printing"
        directPaymentClaim:
          description: Is the claim registered as direct payment claim
          type: boolean
        lastChangeDate:
          description: |
            Last claim change event date.
          type: string
          format: date-time
          example: "2022-12-31T08:05:15Z"
        createdDate:
          description: The creation date of the claim.
          type: string
          format: date-time
          example: "2022-12-31T08:05:15Z"
        claimType:
          $ref: "#/components/schemas/claimType"

    alterClaimDetailsList:
      description: |
        List of claims to be altered
      type: array
      items:
        $ref: "#/components/schemas/alterClaimDetails"

    cancelList:
      description: |
        List of claims to be cancelled. Each array item is the composite claimKey
        (claimantId, account, dueDate). Only identification data is supplied.
      type: array
      items:
        $ref: "#/components/schemas/claimKey"

    secondaryCollection:
      description: |
        This object represents one claim that is being sent to secondary collection.
        - claimKey: identifies the claim (required)
        - templateCode: optional target secondary collection template (overrides default if supplied)
        - otherDefaultCostsAmount: optional additional other default costs applied during transfer
      type: object
      required:
        - claimKey
      properties:
        claimKey:
          $ref: "#/components/schemas/claimKey"
        templateCode:
            $ref: "#/components/schemas/templateCode"
        otherDefaultCostsAmount:
          description: Additional other default costs to apply when moving to secondary collection.
          type: number

    secondaryCollectionList:
      description: |
        List of items to move to secondary collection.
      type: array
      items:
        $ref: "#/components/schemas/secondaryCollection"  

    alterClaimDetails:
      description: |
        Full replacement object for batch alter operations.

        Usage:
          - Client fetches the current claim, updates one or more values (e.g. amount, finalDueDate, expirationDate), and submits the full object.
          - All required fields MUST be present.
          - Optional fields that are omitted are treated as intentionally cleared (removed/reset) if allowed by business rules. To avoid accidental clearing always send the full current state.

        Notes:
          - claimKey identifies the claim and cannot change.
          - Fields not listed as required may still be mandatory under specific business rules (validation occurs server-side).
          - If a field cannot be cleared but is omitted, the server may reject the request.

      type: object
      required:
        - claimKey
        - templateCode
        - amount
        - finalDueDate
        - expirationDate
      properties:
        claimKey:
          $ref: "#/components/schemas/claimKey"
        expirationDate:
          type: string
          format: date
        templateCode:
          $ref: "#/components/schemas/templateCode"
        amount:
          type: number
          minimum: 0
        reference:
          $ref: "#/components/schemas/reference"
        finalDueDate:
          type: string
          format: date
        billNumber:
          type: string
          maxLength: 7
        customerNumber:
          type: string
          maxLength: 16
        paymentFee:
          $ref: "#/components/schemas/paymentFee"
        otherCostsAmount:
          type: number
          minimum: 0
        otherDefaultCostsAmount:
          type: number
          minimum: 0
        defaultCharge:
          $ref: "#/components/schemas/defaultCharge"
        defaultInterest:
          $ref: "#/components/schemas/defaultInterest"
        discount:
          $ref: "#/components/schemas/discount"
        isOutOfSequencePaymentAllowed:
          type: boolean
        isPartialPaymentAllowed:
          type: boolean
        currency:
          type: string
          pattern: '[A-Z]{3}'
        additionalInformation:
          type: string
          maxLength: 200
        claimStatus:
          $ref: "#/components/schemas/claimStatus"
        collectionStatus:
          $ref: "#/components/schemas/collectionStatus"
        printing:
          $ref: "#/components/schemas/printing"


    mergeClaimDetails:
